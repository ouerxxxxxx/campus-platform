<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#004DCC"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <!-- 白环 -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- 门楼建筑 - 苏科大校门象征 -->
  <rect x="35" y="62" width="50" height="22" rx="2" fill="white"/>
  <rect x="44" y="62" width="10" height="22" fill="url(#bg)"/>
  <rect x="66" y="62" width="10" height="22" fill="url(#bg)"/>
  <!-- 门楣 -->
  <rect x="32" y="56" width="56" height="8" rx="2" fill="white"/>
  <!-- 屋顶 -->
  <polygon points="30,56 60,40 90,56" fill="white"/>
  <!-- 苏字 -->
  <text x="60" y="53" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="STSong,SimSun,serif" letter-spacing="2">苏科大</text>
</svg>
