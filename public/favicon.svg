<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#008CD6"/>
      <stop offset="100%" stop-color="#0069A3"/>
    </linearGradient>
  </defs>
  <!-- 外环 -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#blueGrad)" stroke-width="8"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#blueGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- 内环 -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.6"/>
  <!-- 上半弧：SUZHOU UNIVERSITY OF -->
  <path id="top-arc" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <text font-size="10" font-family="Arial,Helvetica,sans-serif" fill="#202124" font-weight="bold" letter-spacing="2.2">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">SUZHOU UNIVERSITY OF</textPath>
  </text>
  <!-- 下半弧：SCIENCE AND TECHNOLOGY -->
  <path id="bot-arc" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>
  <text font-size="10" font-family="Arial,Helvetica,sans-serif" fill="#202124" font-weight="bold" letter-spacing="2.2">
    <textPath href="#bot-arc" startOffset="50%" text-anchor="middle">SCIENCE AND TECHNOLOGY</textPath>
  </text>
  <!-- 中心 S 抽象造型（上升态） -->
  <g transform="translate(100,100)">
    <path d="M -18 28 C -38 20 -42 -2 -25 -14 C -8 -26 12 -24 22 -8 C 32 8 25 22 5 27"
          fill="none" stroke="url(#blueGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-25" cy="-14" r="3.5" fill="url(#blueGrad)" opacity="0.4"/>
    <circle cx="22" cy="-8" r="3.5" fill="url(#blueGrad)" opacity="0.4"/>
  </g>
  <!-- 底部中文校名 -->
  <text x="100" y="175" text-anchor="middle" font-size="16" font-family="SimHei,PingFang SC,Microsoft YaHei,sans-serif" fill="#202124" font-weight="bold" letter-spacing="6">苏州科技大学</text>
</svg>
